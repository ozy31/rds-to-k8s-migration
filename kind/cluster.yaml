# One control plane and two workers in different zones, enough to see
# instances spread the way they would across availability zones on EKS.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: db-migration
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
